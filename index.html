<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SyChro</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1A1A1A">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="SyChro">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@400;700&family=Plus+Jakarta+Sans:wght@400;700&family=Lora:ital@1" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
<style>
    /* Override validi solo per questa home page */
    .home-logo {
        display: block;
        height: 100px;
        max-width: 80vw;
        width: auto;
        margin: 0 auto 1.5rem;
    }
    main h1,
    main p {
        max-width: 1100px;
    }
    .home-hero {
        display: contents; /* su desktop non cambia nulla */
    }

    .install-btn,
    .install-sheet {
        display: none; /* mai visibili su desktop */
    }

    /* ===== Solo mobile: home riorganizzata ===== */
    @media (max-width: 650px) {
        main.home-main {
            min-height: 100vh;
            min-height: 100dvh;
            justify-content: space-between;
            padding: 2.5rem 1.5rem calc(2rem + env(safe-area-inset-bottom));
        }

        /* Blocco titolo: centrato verticalmente nello spazio disponibile */
        .home-hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding-bottom: 2rem;
        }

        .home-logo {
            height: 64px;
            margin-bottom: 1.75rem;
        }

        .home-hero h1 {
            font-size: 2.15rem;
            line-height: 1.1;
            margin-bottom: 1rem;
        }

        .home-hero p {
            font-size: 1rem;
            line-height: 1.55;
            margin: 0;
            max-width: 30ch;
        }

        /* Pulsanti in basso, a portata di pollice */
        .cta-home {
            gap: 1.25rem;
        }

        .cta-home .btn-primary {
            min-height: 54px;
            font-size: 1.1rem;
        }

        /* Link secondari: elenco con righe sottili e freccia */
        .cta-links {
            gap: 0;
            align-items: stretch;
            width: 100%;
            border-top: 1px solid rgba(191, 149, 63, 0.3);
        }

        .cta-links a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 52px;
            padding: 0 0.25rem;
            font-size: 1rem;
            color: #E6E6E6;
            border-bottom: 1px solid rgba(191, 149, 63, 0.3);
        }

        .cta-links a::after {
            content: "";
            width: 8px;
            height: 8px;
            border-top: 1.5px solid #BF953F;
            border-right: 1.5px solid #BF953F;
            transform: rotate(45deg);
            margin-right: 4px;
            flex-shrink: 0;
        }

        .cta-links a:hover,
        .cta-links a:active {
            color: #BF953F;
            border-bottom-color: rgba(191, 149, 63, 0.3);
        }

        /* Aggiungi alla schermata Home */
        .install-btn:not([hidden]) {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            padding: 0.6rem 0.9rem;
            min-height: 44px;
            background: none;
            border: none;
            color: #BF953F;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .install-btn:focus-visible {
            outline: 2px solid #BF953F;
            outline-offset: 2px;
            border-radius: 6px;
        }

        .install-sheet[open] {
            display: block;
            position: fixed;
            inset: auto 0 0 0;
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 1.75rem 1.5rem calc(1.5rem + env(safe-area-inset-bottom));
            border: none;
            border-top: 1px solid rgba(191, 149, 63, 0.5);
            border-radius: 16px 16px 0 0;
            background: #262626;
            color: #FFFFFF;
            text-align: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .install-sheet::backdrop {
            background: rgba(0, 0, 0, 0.6);
        }

        .install-sheet img {
            border-radius: 12px;
        }

        .install-sheet h2 {
            font-family: 'Darker Grotesque', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #BF953F;
            margin: 0.75rem 0 1rem;
            line-height: 1.1;
        }

        .install-sheet ol {
            text-align: left;
            margin: 0 auto 1.5rem;
            padding-left: 1.4rem;
            max-width: 22rem;
            font-size: 1rem;
            line-height: 1.6;
        }

        .install-sheet li + li {
            margin-top: 0.6rem;
        }

        .install-sheet .share-icon {
            display: inline-block;
            vertical-align: -3px;
            color: #BF953F;
        }

        .install-sheet .btn {
            width: 100%;
            min-height: 48px;
        }
    }
</style>
</head>
<body>

<main class="home-main">
    <div class="home-hero">
        <img class="home-logo" src="logo.svg" alt="SyChro">
        <h1>The Steps Towards a New Thinking Approach</h1>
        <p>A journey through the evolution of the systemic approach in sustainability and design</p>
    </div>

    <div class="cta-group cta-home">
        <a class="btn btn-primary" id="explore-btn" href="https://serenatreppiedi.github.io/SystemicTimeline-V4/">Explore SyChro</a>
        <nav class="cta-links" aria-label="More">
            <a href="about.html">About</a>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSeUoOQV_mKtxhJ3AtIlNVkIJlToYJGXlte8i6li09yvkemw2Q/viewform?usp=header" target="_blank" rel="noopener">Contribute to the Database</a>
            <a href="contacts.html">Contacts</a>
        </nav>
    </div>

    <button type="button" class="install-btn" id="install-btn" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/></svg>
        Add SyChro to your home screen
    </button>
</main>

<dialog class="install-sheet" id="install-sheet" aria-labelledby="install-title">
    <img src="apple-touch-icon.png" alt="" width="56" height="56" onerror="this.onerror=null;this.src='favicon.svg';">
    <h2 id="install-title">Add SyChro to your home screen</h2>
    <ol id="install-steps"></ol>
    <form method="dialog"><button class="btn">Got it</button></form>
</dialog>

<script>
/* ===== Explore SyChro: controllo di disponibilità della timeline =====
   Prima di aprire la timeline verifica che il sito risponda.
   Se è irraggiungibile, dà errore (404, 500…) o non risponde entro 5 secondi,
   apre invece la pagina explore.html ("SyChro is systemically evolving!"). */
(function () {
    const TIMELINE_URL = 'https://serenatreppiedi.github.io/SystemicTimeline-V4/';
    const FALLBACK_URL = 'explore.html';
    const TIMEOUT_MS = 5000;
    const btn = document.getElementById('explore-btn');

    async function isTimelineUp() {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
        try {
            // GitHub Pages permette la lettura dello stato (CORS): controlliamo il codice di risposta
            const res = await fetch(TIMELINE_URL, { cache: 'no-store', signal: ctrl.signal });
            return res.ok;
        } catch (err) {
            if (err.name === 'AbortError') return false;
            // Se il controllo CORS non è permesso, verifichiamo almeno che il sito sia raggiungibile
            try {
                await fetch(TIMELINE_URL, { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal });
                return true;
            } catch (e) {
                return false;
            }
        } finally {
            clearTimeout(timer);
        }
    }

    // Il controllo parte subito al caricamento, così il clic è immediato
    const check = isTimelineUp();

    btn.addEventListener('click', async (e) => {
        // Ctrl/Cmd+clic o clic centrale: lascia il comportamento normale del browser
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
        e.preventDefault();
        btn.setAttribute('aria-busy', 'true');
        btn.classList.add('is-loading');
        const up = await check;
        window.location.href = up ? TIMELINE_URL : FALLBACK_URL;
    });

    // Se l'utente torna indietro alla home, ripristina il pulsante
    window.addEventListener('pageshow', () => {
        btn.removeAttribute('aria-busy');
        btn.classList.remove('is-loading');
    });
})();
</script>

<script>
/* ===== Aggiungi alla schermata Home (Android + iPhone/iPad) =====
   - Android/Chrome: apre la richiesta di installazione nativa.
   - iPhone/iPad: Apple non permette di farlo in automatico, quindi mostriamo le istruzioni.
   - Il pulsante non compare se il sito è già aperto dall'icona o su desktop. */
(function () {
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    const btn = document.getElementById('install-btn');
    const sheet = document.getElementById('install-sheet');
    const steps = document.getElementById('install-steps');

    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    const ua = navigator.userAgent;
    const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/.test(ua);
    const isMobile = window.matchMedia('(max-width: 650px)').matches || isIOS || isAndroid;

    if (isStandalone || !isMobile) return;

    const SHARE_ICON = '<svg class="share-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="Share"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8"/></svg>';

    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        btn.hidden = false;
    });

    window.addEventListener('appinstalled', () => {
        btn.hidden = true;
        deferredPrompt = null;
    });

    if (isIOS) {
        btn.hidden = false;
    } else if (isAndroid) {
        // Browser Android che non supportano l'installazione diretta (es. Firefox): mostra comunque il pulsante con le istruzioni
        setTimeout(() => { btn.hidden = false; }, 1500);
    }

    function showInstructions() {
        if (isIOS) {
            steps.innerHTML =
                '<li>Tap the Share button ' + SHARE_ICON + ' in your browser bar.</li>' +
                '<li>Scroll down and tap <strong>Add to Home Screen</strong>.</li>' +
                '<li>Tap <strong>Add</strong>. SyChro will appear among your apps.</li>';
        } else {
            steps.innerHTML =
                '<li>Open your browser menu (<strong>⋮</strong> or <strong>≡</strong>).</li>' +
                '<li>Tap <strong>Add to Home screen</strong>, <strong>Add to phone</strong> or <strong>Install app</strong>.</li>' +
                '<li>Confirm. SyChro will appear among your apps.</li>';
        }
        if (typeof sheet.showModal === 'function') {
            sheet.showModal();
        }
    }

    btn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const choice = await deferredPrompt.userChoice;
            deferredPrompt = null;
            if (choice.outcome === 'accepted') btn.hidden = true;
        } else {
            showInstructions();
        }
    });

    // Tocco fuori dalla finestra: la chiude
    sheet.addEventListener('click', (e) => { if (e.target === sheet) sheet.close(); });
})();
</script>

</body>
</html>
