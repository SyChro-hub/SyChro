<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SyChro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@400;700&family=Plus+Jakarta+Sans:wght@400;700&family=Lora:ital@1" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
<style>
    /* Override validi solo per questa home page */
    .home-logo {
        display: block;
        height: 100px;
        max-width: 80vw;
        width: auto;
        margin: 0 auto 1.5rem;
    }
    main h1,
    main p {
        max-width: 1100px;
    }
    .home-hero {
        display: contents; /* su desktop non cambia nulla */
    }

    /* ===== Solo mobile: home riorganizzata ===== */
    @media (max-width: 650px) {
        main.home-main {
            min-height: 100vh;
            min-height: 100dvh;
            justify-content: space-between;
            padding: 2.5rem 1.5rem calc(2rem + env(safe-area-inset-bottom));
        }

        /* Blocco titolo: centrato verticalmente nello spazio disponibile */
        .home-hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding-bottom: 2rem;
        }

        .home-logo {
            height: 64px;
            margin-bottom: 1.75rem;
        }

        .home-hero h1 {
            font-size: 2.15rem;
            line-height: 1.1;
            margin-bottom: 1rem;
        }

        .home-hero p {
            font-size: 1rem;
            line-height: 1.55;
            margin: 0;
            max-width: 30ch;
        }

        /* Pulsanti in basso, a portata di pollice */
        .cta-home {
            gap: 1.25rem;
        }

        .cta-home .btn-primary {
            min-height: 54px;
            font-size: 1.1rem;
        }

        /* Link secondari: elenco con righe sottili e freccia */
        .cta-links {
            gap: 0;
            align-items: stretch;
            width: 100%;
            border-top: 1px solid rgba(191, 149, 63, 0.3);
        }

        .cta-links a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 52px;
            padding: 0 0.25rem;
            font-size: 1rem;
            color: #E6E6E6;
            border-bottom: 1px solid rgba(191, 149, 63, 0.3);
        }

        .cta-links a::after {
            content: "";
            width: 8px;
            height: 8px;
            border-top: 1.5px solid #BF953F;
            border-right: 1.5px solid #BF953F;
            transform: rotate(45deg);
            margin-right: 4px;
            flex-shrink: 0;
        }

        .cta-links a:hover,
        .cta-links a:active {
            color: #BF953F;
            border-bottom-color: rgba(191, 149, 63, 0.3);
        }
    }
</style>
</head>
<body>

<main class="home-main">
    <div class="home-hero">
        <img class="home-logo" src="logo.svg" alt="SyChro">
        <h1>The Steps Towards a New Thinking Approach</h1>
        <p>A journey through the evolution of the systemic approach in sustainability and design</p>
    </div>

    <div class="cta-group cta-home">
        <a class="btn btn-primary" id="explore-btn" href="https://serenatreppiedi.github.io/SystemicTimeline-V4/">Explore SyChro</a>
        <nav class="cta-links" aria-label="More">
            <a href="about.html">About</a>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSeUoOQV_mKtxhJ3AtIlNVkIJlToYJGXlte8i6li09yvkemw2Q/viewform?usp=header" target="_blank" rel="noopener">Contribute to the Database</a>
            <a href="contacts.html">Contacts</a>
        </nav>
    </div>
</main>

<script>
/* ===== Explore SyChro: controllo di disponibilità della timeline =====
   Prima di aprire la timeline verifica che il sito risponda.
   Se è irraggiungibile, dà errore (404, 500…) o non risponde entro 5 secondi,
   apre invece la pagina explore.html ("SyChro is systemically evolving!"). */
(function () {
    const TIMELINE_URL = 'https://serenatreppiedi.github.io/SystemicTimeline-V4/';
    const FALLBACK_URL = 'explore.html';
    const TIMEOUT_MS = 5000;
    const btn = document.getElementById('explore-btn');

    async function isTimelineUp() {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
        try {
            // GitHub Pages permette la lettura dello stato (CORS): controlliamo il codice di risposta
            const res = await fetch(TIMELINE_URL, { cache: 'no-store', signal: ctrl.signal });
            return res.ok;
        } catch (err) {
            if (err.name === 'AbortError') return false;
            // Se il controllo CORS non è permesso, verifichiamo almeno che il sito sia raggiungibile
            try {
                await fetch(TIMELINE_URL, { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal });
                return true;
            } catch (e) {
                return false;
            }
        } finally {
            clearTimeout(timer);
        }
    }

    // Il controllo parte subito al caricamento, così il clic è immediato
    const check = isTimelineUp();

    btn.addEventListener('click', async (e) => {
        // Ctrl/Cmd+clic o clic centrale: lascia il comportamento normale del browser
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
        e.preventDefault();
        btn.setAttribute('aria-busy', 'true');
        btn.classList.add('is-loading');
        const up = await check;
        window.location.href = up ? TIMELINE_URL : FALLBACK_URL;
    });

    // Se l'utente torna indietro alla home, ripristina il pulsante
    window.addEventListener('pageshow', () => {
        btn.removeAttribute('aria-busy');
        btn.classList.remove('is-loading');
    });
})();
</script>

</body>
</html>
